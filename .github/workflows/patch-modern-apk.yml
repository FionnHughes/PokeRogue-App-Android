name: Patch Modern APK

# Rebuilds the Modern (PodarSmarty) app with the save-import fix applied, a
# "Copy Pokémon caught", "Sync saves" and "Restore backup" entries added to the
# drawer, and an on-screen log for Import Data.
# The result is published as a DRAFT release: only people with write access to
# this repository can see or download it. That app is closed-source, so the
# patched copy is for personal testing and is not redistributed publicly.

on:
  push:
    branches: [fix/android-save-import]
    paths:
      - scripts/patch_modern_apk.py
      - modern-patch/**
      - .github/workflows/patch-modern-apk.yml
      - app/src/main/java/com/example/pokerogueoffline/MainActivity.kt
  workflow_dispatch:

permissions:
  contents: write

env:
  MODERN_APK_URL: https://github.com/Admiral-Billy/Pokerogue-App/releases/download/v2.4.6f/PokeRogue-Android-Modern-PodarSmarty.apk
  MODERN_APK_SHA256: 0037ee78f77dea86b16beb1b1a10640b789b19a284cbfaf1466af7ed64f668f4
  APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
  APKTOOL_SHA256: 56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db
  SIGNER_URL: https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
  SIGNER_SHA256: e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the original APK and tools
        run: |
          mkdir work
          curl -sSfL -o work/modern.apk "$MODERN_APK_URL"
          curl -sSfL -o work/apktool.jar "$APKTOOL_URL"
          curl -sSfL -o work/signer.jar "$SIGNER_URL"
          cd work
          echo "$MODERN_APK_SHA256  modern.apk" | sha256sum -c -
          echo "$APKTOOL_SHA256  apktool.jar" | sha256sum -c -
          echo "$SIGNER_SHA256  signer.jar" | sha256sum -c -

      - name: Compile the sync helper
        run: |
          # The runner ships the Android SDK: android.jar to compile against, d8 to make a dex.
          platform=$(ls "$ANDROID_HOME/platforms" | sort -V | tail -1)
          tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          android_jar="$ANDROID_HOME/platforms/$platform/android.jar"
          echo "using $platform and build-tools $tools"
          mkdir -p work/helper/classes work/helper/dex
          javac --release 8 -cp "$android_jar" -d work/helper/classes \
            $(find modern-patch/src -name '*.java')
          "$ANDROID_HOME/build-tools/$tools/d8" --min-api 28 --lib "$android_jar" \
            --output work/helper/dex $(find work/helper/classes -name '*.class')
          mv work/helper/dex/classes.dex work/helper/dex/classes3.dex

      - name: Decode, patch, rebuild, sign
        run: |
          cd work
          # -r keeps resources and the manifest untouched; only code is rebuilt
          java -jar apktool.jar d -r -f -o decoded modern.apk
          python3 ../scripts/patch_modern_apk.py decoded
          # With -r apktool cannot read minSdk from the manifest and would emit
          # old-format dex files that Android refuses to load (crash on launch).
          # The app's minSdk is 28, so build for that level.
          java -jar apktool.jar b --api-level 28 decoded -o unsigned/modern.apk
          # Only classes2.dex holds patched code; keep classes.dex byte-identical.
          mkdir orig && unzip -q -o modern.apk classes.dex -d orig
          (cd orig && zip -q -0 -X ../unsigned/modern.apk classes.dex)
          # The compiled sync helper rides along as an extra code file.
          (cd helper/dex && zip -q -0 -X ../../unsigned/modern.apk classes3.dex)
          java -jar signer.jar -a unsigned/modern.apk --out signed
          cp signed/modern-aligned-debugSigned.apk ../OfflineRogue-Modern-importfix.apk

      - name: Check the rebuilt code files match the original format
        run: |
          cd work
          for dex in classes.dex classes2.dex; do
            want=$(unzip -p modern.apk "$dex" | head -c 7 | od -An -c | tr -d ' \n')
            got=$(unzip -p ../OfflineRogue-Modern-importfix.apk "$dex" | head -c 7 | od -An -c | tr -d ' \n')
            echo "$dex: original=$want patched=$got"
            [ "$want" = "$got" ] || { echo "dex format version changed"; exit 1; }
          done
          cmp <(unzip -p modern.apk classes.dex) <(unzip -p ../OfflineRogue-Modern-importfix.apk classes.dex)

      - name: Check the hooks and the sync helper line up
        run: |
          cd work
          # A hook that names a method the helper does not have would crash the app,
          # so decode the finished APK and compare both sides.
          java -jar apktool.jar d -r -f -o verify ../OfflineRogue-Modern-importfix.apk > /dev/null
          helper=$(find verify -path '*importfix/SaveSync.smali')
          sections=verify/smali_classes2/labs/smarty/offlinerogue/ui/composable/sections
          test -n "$helper"
          grep -qF '.method public static attach(Landroid/webkit/WebView;)V' "$helper"
          grep -qF '.method public static onPageFinished(Landroid/webkit/WebView;Ljava/lang/String;)V' "$helper"
          grep -qF '.method public static setActivity(Landroid/app/Activity;)V' "$helper"
          grep -qF '.method public static onDrawerEntry(I)V' "$helper"
          grep -qF '.method public static onPickerResult(Landroid/net/Uri;)V' "$helper"
          grep -qF 'Limportfix/SaveSync;->onPickerResult(Landroid/net/Uri;)V' "$sections/GameViewKt.smali"
          grep -qF 'Limportfix/SaveSync;->attach(Landroid/webkit/WebView;)V' "$sections/GameViewKt.smali"
          grep -qF 'Limportfix/SaveSync;->onPageFinished(Landroid/webkit/WebView;Ljava/lang/String;)V' "$sections/LocalWebViewClient.smali"
          grep -qF 'Limportfix/SaveSync;->onDrawerEntry(I)V' "$sections/ToolsSectionKt.smali"
          # The helper's scripts and name tables must be inside the APK.
          for script in tables.js starters.js offline.js online.js; do
            unzip -l ../OfflineRogue-Modern-importfix.apk | grep -q "assets/savesync/$script"
          done
          grep -qF 'Limportfix/SaveSync;->setActivity(Landroid/app/Activity;)V' verify/smali_classes2/labs/smarty/offlinerogue/MainActivity.smali
          echo "hooks and helper match"

      - name: Check the launch mode change
        run: |
          # The patched manifest must differ from the original by exactly one byte.
          cd work
          changed=$(cmp -l <(unzip -p modern.apk AndroidManifest.xml) <(unzip -p ../OfflineRogue-Modern-importfix.apk AndroidManifest.xml) | wc -l)
          echo "manifest bytes changed: $changed"
          [ "$changed" = "1" ]

      - name: Publish as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="modern-importfix-${GITHUB_SHA::7}"
          # Remove earlier drafts of this build so only the newest one is offered
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft and (.tagName | startswith("modern-importfix-"))) | .tagName' \
            | while read -r old; do gh release delete "$old" --yes || true; done
          gh release create "$tag" OfflineRogue-Modern-importfix.apk \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Modern app with import fix and online sync (private draft) ${GITHUB_SHA::7}" \
            --notes "Personal test build of the Modern (PodarSmarty) app with the save-import fix and three drawer entries patched in: Copy Pokemon caught, Sync saves (save data, run history and runs in progress, with a recommended sync and a step-by-step log) and Restore backup. Untested on real devices until confirmed. Installs over earlier builds from this workflow; uninstall the original Modern app first, because the signature differs. Draft on purpose: not for redistribution."

name: Patch Modern APK

# Rebuilds the Modern (PodarSmarty) app with the save-import fix applied.
# The result is published as a DRAFT release: only people with write access to
# this repository can see or download it. That app is closed-source, so the
# patched copy is for personal testing and is not redistributed publicly.

on:
  push:
    branches: [fix/android-save-import]
    paths:
      - scripts/patch_modern_apk.py
      - .github/workflows/patch-modern-apk.yml
      - app/src/main/java/com/example/pokerogueoffline/MainActivity.kt
  workflow_dispatch:

permissions:
  contents: write

env:
  MODERN_APK_URL: https://github.com/Admiral-Billy/Pokerogue-App/releases/download/v2.4.6f/PokeRogue-Android-Modern-PodarSmarty.apk
  MODERN_APK_SHA256: 0037ee78f77dea86b16beb1b1a10640b789b19a284cbfaf1466af7ed64f668f4
  APKTOOL_URL: https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
  APKTOOL_SHA256: 56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db
  SIGNER_URL: https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
  SIGNER_SHA256: e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download the original APK and tools
        run: |
          mkdir work
          curl -sSfL -o work/modern.apk "$MODERN_APK_URL"
          curl -sSfL -o work/apktool.jar "$APKTOOL_URL"
          curl -sSfL -o work/signer.jar "$SIGNER_URL"
          cd work
          echo "$MODERN_APK_SHA256  modern.apk" | sha256sum -c -
          echo "$APKTOOL_SHA256  apktool.jar" | sha256sum -c -
          echo "$SIGNER_SHA256  signer.jar" | sha256sum -c -

      - name: Decode, patch, rebuild, sign
        run: |
          cd work
          # -r keeps resources and the manifest untouched; only code is rebuilt
          java -jar apktool.jar d -r -f -o decoded modern.apk
          python3 ../scripts/patch_modern_apk.py decoded
          java -jar apktool.jar b decoded -o unsigned/modern.apk
          java -jar signer.jar -a unsigned/modern.apk --out signed
          cp signed/modern-aligned-debugSigned.apk ../OfflineRogue-Modern-importfix.apk

      - name: Publish as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="modern-importfix-${GITHUB_SHA::7}"
          gh release create "$tag" OfflineRogue-Modern-importfix.apk \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Modern app with import fix (private draft) ${GITHUB_SHA::7}" \
            --notes "Personal test build of the Modern (PodarSmarty) app with the save-import fix patched in. Untested on real devices until confirmed. Uninstall the existing Modern app before installing, because the signature differs. Draft on purpose: not for redistribution."
